<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devine le personnage – Le Bonfire</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070b16; --panel:#0e1526; --line:#243149; --tx:#e9eef7; --mu:#8d9ab2; --cyan:#3fc1e0; --gold:#e6c36a; --gold-d:#a67c2a; --ok:#4ade80; --ko:#ff6b6b; --frame:#56709c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; color: var(--tx); background: var(--bg); position: relative; overflow-x: hidden; font: 16px/1.5 Barlow, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body::before { content: ""; position: fixed; inset: -20px; z-index: -2; background: url("nashor.jpg") center / cover no-repeat; filter: blur(16px) brightness(.3) saturate(1.2); }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(ellipse at 50% 0%, rgba(63,193,224,.12), transparent 55%), linear-gradient(rgba(7,11,22,.55), var(--bg) 95%); }
  .top { position: sticky; top: 0; z-index: 40; background: rgba(7,11,22,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 980px; margin: 0 auto; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--tx); text-decoration: none; font-family: Cinzel, Georgia, serif; font-weight: 800; letter-spacing: .08em; font-size: 1.05rem; }
  .brand .mark { width: 30px; height: 30px; }
  nav { display: flex; gap: 6px; }
  nav a { padding: 7px 14px; border-radius: 10px; color: #dbe3f1; text-decoration: none; font-weight: 600; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; border: 1.5px solid var(--frame); background: rgba(24,35,62,.92); }
  nav a:hover { border-color: var(--cyan); }
  nav a.on { color: var(--cyan); border-color: rgba(63,193,224,.4); background: rgba(63,193,224,.08); }
  main { max-width: 860px; margin: 0 auto; padding: 30px 16px 20px; }
  .hero { text-align: center; margin-bottom: 22px; }
  h1 { display: inline-flex; align-items: center; gap: 18px; margin: 0; font-family: Cinzel, Georgia, serif; font-weight: 800; font-size: clamp(1.7rem, 6vw, 3rem); letter-spacing: .05em;
       background: linear-gradient(#fff3c4, var(--gold) 45%, var(--gold-d)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 8px rgba(0,0,0,.8)); }
  h1::before, h1::after { content: ""; width: clamp(20px, 7vw, 80px); height: 2px; background: linear-gradient(90deg, transparent, var(--gold)); }
  h1::after { transform: scaleX(-1); }
  .sub { margin: 8px 0 0; color: #c9d3e4; font-size: 1.1rem; font-weight: 500; }
  .game { max-width: 820px; margin: 0 auto; padding: 20px 22px 24px; border: 1px solid var(--line); border-radius: 18px; background: rgba(14,21,38,.86); box-shadow: 0 16px 44px rgba(0,0,0,.6); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .plates { display: flex; gap: 14px; }
  .plate { display: inline-flex; align-items: baseline; gap: 8px; padding: 5px 13px; border: 1.5px solid var(--frame); border-radius: 12px; background: rgba(24,35,62,.92); color: #aab6cd; font-size: .76rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
  .plate b { font-size: 1.2rem; font-weight: 700; letter-spacing: 0; color: var(--gold); text-transform: none; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { padding: 7px 16px; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; background: rgba(24,35,62,.92); color: #dbe3f1; border: 1.5px solid var(--frame); }
  .tabs button.on { color: var(--cyan); border-color: var(--cyan); background: rgba(63,193,224,.1); }
  button { padding: 13px 22px; border: 0; border-radius: 10px; font: inherit; font-size: 1.05rem; font-weight: 700; cursor: pointer; background: var(--cyan); color: #04202a; transition: transform .15s, filter .15s; }
  button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); }
  .q { text-align: center; font-size: 1.35rem; font-weight: 700; margin: 6px 0 20px; min-height: 2em; }
  .q b { color: var(--gold); }
  .duel { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .vs { font-family: Cinzel, Georgia, serif; font-weight: 800; color: var(--gold); font-size: 1.1rem; }
  .opt_unused { flex: 1; max-width: 300px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 10px 16px; border-radius: 16px; border: 2px solid var(--frame); background: rgba(24,35,62,.92); color: var(--tx); cursor: pointer; box-shadow: 0 8px 22px rgba(0,0,0,.45); transition: transform .15s, border-color .15s, box-shadow .15s; }
  .opt_unused:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--cyan); box-shadow: 0 0 22px rgba(63,193,224,.3); filter: none; }
  .opt_unused:disabled { cursor: default; opacity: 1; }
  .opt_unused .pic { width: min(150px, 34vw); aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--gold); background: #0b0f14; box-shadow: 0 0 0 2px #000; overflow: hidden; display: grid; place-items: center; }
  .opt_unused .pic img { width: 100%; height: 100%; display: block; }
  .opt_unused .nm { font-size: 1.05rem; font-weight: 700; text-align: center; line-height: 1.15; min-height: 2.3em; display: grid; place-items: center; }
  .opt_unused .val { min-width: 96px; padding: 4px 12px; border-radius: 99px; border: 1.5px dashed #46557a; color: var(--mu); font-weight: 700; font-size: 1.1rem; text-align: center; }
  .opt_unused.show .val { border-style: solid; border-color: var(--gold); color: var(--gold); background: rgba(230,195,106,.1); }
  .opt_unused.right { border-color: var(--ok); box-shadow: 0 0 24px rgba(74,222,128,.35); }
  .opt_unused.right .val { border-color: var(--ok); color: var(--ok); background: rgba(74,222,128,.1); }
  .opt_unused.wrong { border-color: var(--ko); box-shadow: 0 0 24px rgba(255,107,107,.3); animation: shake .3s; }
  .opt_unused.wrong .val { border-color: var(--ko); color: var(--ko); background: rgba(255,107,107,.1); }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .result { text-align: center; margin-top: 20px; min-height: 90px; }
  .msg { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
  .msg.ko { color: var(--ko); } .msg.ok { color: var(--ok); }
  .msg small { display: block; color: var(--mu); font-size: .92rem; font-weight: 500; }
  .result button { margin-top: 12px; }
  .status { text-align: center; color: var(--mu); padding: 30px 0; }
  footer { max-width: 980px; margin: 14px auto 0; padding: 22px 18px 34px; color: #66738c; font-size: .8rem; text-align: center; border-top: 1px solid rgba(36,49,73,.7); }
  [hidden] { display: none !important; }
  @media (max-width: 560px) { nav a { padding: 7px 9px; font-size: .78rem; letter-spacing: .05em; } .brand { font-size: .9rem; } .game { padding: 16px 10px 18px; } .duel { gap: 6px; } .opt { padding: 12px 6px; } .opt .nm { font-size: .92rem; } .q { font-size: 1.15rem; } }
  @media (max-width: 400px) { .brand { display: none; } .top-in { justify-content: center; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .clues { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 16px; }
  .ph { padding: 12px 16px; border: 1.5px solid var(--frame); border-radius: 14px; background: rgba(24,35,62,.92); animation: pop .35s ease; }
  .ph h3 { margin: 0 0 6px; font-family: "Barlow Condensed", Barlow, sans-serif; font-size: .9rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); display: flex; justify-content: space-between; gap: 8px; }
  .ph h3 small { color: var(--mu); letter-spacing: .06em; font-size: .85rem; }
  .ph ul { margin: 0; padding-left: 20px; } .ph li { margin: 3px 0; font-size: 1.04rem; }
  .ph.p2 { border-color: #6a86b5; } .ph.p3 { border-color: var(--cyan); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .guess { position: relative; max-width: 460px; margin: 0 auto; }
  .row { display: flex; gap: 10px; }
  input { flex: 1; min-width: 0; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(7,11,22,.8); color: var(--tx); font: inherit; font-size: 1.15rem; font-weight: 600; }
  input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(63,193,224,.2); }
  input.shake { animation: shake .3s; border-color: var(--ko); }
  .sug { position: absolute; left: 0; right: 96px; bottom: 100%; margin-bottom: 4px; max-height: 260px; overflow: auto; border: 1.5px solid var(--frame); border-radius: 12px; background: rgba(14,21,38,.98); box-shadow: 0 10px 30px rgba(0,0,0,.6); z-index: 10; }
  .sug div { display: flex; align-items: center; gap: 10px; padding: 6px 10px; cursor: pointer; font-weight: 600; }
  .sug div img { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); }
  .sug div.on, .sug div:hover { background: rgba(63,193,224,.15); }
  .tools { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  button.alt { padding: 9px 16px; font-size: .92rem; background: rgba(24,35,62,.92); color: #dbe3f1; border: 1.5px solid var(--frame); font-weight: 600; }
  button.alt:hover:not(:disabled) { border-color: var(--cyan); filter: none; }
  button:disabled { opacity: .45; cursor: default; }
  .flash { min-height: 22px; margin: 8px 2px 0; text-align: center; color: var(--ko); font-size: .9rem; font-weight: 600; }
  .misses { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .misses li { padding: 3px 12px; border-radius: 10px; border: 1px solid rgba(255,107,107,.55); background: rgba(255,107,107,.1); font-weight: 700; font-size: .9rem; }
  .reveal { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .reveal img { width: 96px; height: 96px; border-radius: 14px; border: 2px solid var(--gold); box-shadow: 0 0 0 2px #000; }
  .reveal .big { font-family: Cinzel, Georgia, serif; font-weight: 800; font-size: 1.5rem; color: var(--gold); }
  .reveal .tt { color: var(--mu); }
  .result { text-align: center; margin-top: 8px; }
  .result .msg { margin-top: 8px; }
  .faits { max-width: 520px; margin: 10px auto 0; text-align: left; color: #c9d3e4; font-size: .95rem; }
  .faits li { margin: 2px 0; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="index.html"><img class="mark" src="logo.svg" alt="" width="30" height="30">LE BONFIRE</a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="shopkeeper.html">Shop</a>
      <a class="on" href="devine.html">Devine</a>
    </nav>
  </div>
</header>
<main>
  <section class="hero">
    <h1>Devine le personnage</h1>
    <p class="sub">Quel champion se cache derrière ces indices ?</p>
  </section>
  <section class="game">
    <div class="bar">
      <div class="plates">
        <span class="plate">Score <b id="score">0</b></span>
        <span class="plate">Série <b id="streak">0</b></span>
        <span class="plate">Record <b id="best">0</b></span>
      </div>
    </div>
    <div class="status" id="status">Chargement des champions…</div>
    <div id="board" hidden>
      <div class="clues" id="clues"></div>
      <ul class="misses" id="misses"></ul>
      <div id="play">
        <div class="guess">
          <div class="sug" id="sug" hidden></div>
          <div class="row">
            <input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nom du champion…" aria-label="Nom du champion">
            <button id="submit" disabled>Valider</button>
          </div>
        </div>
        <div class="flash" id="flash" role="status"></div>
        <div class="tools">
          <button class="alt" id="more" type="button">Indice suivant <small id="moreCost"></small></button>
          <button class="alt" id="giveUp" type="button">Abandonner</button>
        </div>
      </div>
      <div class="result" id="result" hidden>
        <div class="reveal" id="reveal"></div>
        <div class="msg" id="msg"></div>
        <ul class="faits" id="faits"></ul>
        <button id="next" style="margin-top:14px">Personnage suivant →</button>
      </div>
    </div>
  </section>
</main>
<footer>Projet de fan, non affilié à Riot Games. League of Legends et ses personnages appartiennent à Riot Games, Inc.</footer>
<script>
const $ = id => document.getElementById(id);
const nk = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
const fmt = n => n.toLocaleString("fr-FR").replace(/\u202f|\u00a0/g, " ");
const POINTS = [1000, 600, 300];
const LABELS = ["Phase 1 · Vague", "Phase 2 · Quelques infos", "Phase 3 · Précis"];
const DD = "https://ddragon.leagueoflegends.com/";
let all = [], ver = "", icons = {}, deck = [], cur = null, phase = 0, over = false, score = 0, streak = 0, best = 0, misses = [], sugList = [], sugI = -1;
try { best = Number(localStorage.getItem("sdq_best_devine")) || 0; } catch (e) {}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const icon = c => icons[nk(c.id)] ? `${DD}cdn/${ver}/img/champion/${icons[nk(c.id)]}.png` : "";

async function load() {
  all = (await (await fetch("donnees/champions.json")).json()).filter(c => c.indices && c.indices["1"] && c.indices["1"].length);
  try {
    ver = (await (await fetch(DD + "api/versions.json")).json())[0];
    const d = (await (await fetch(`${DD}cdn/${ver}/data/fr_FR/champion.json`)).json()).data;
    Object.keys(d).forEach(k => { icons[nk(k)] = k; });
  } catch (e) {}
}
function renderBar() { $("score").textContent = fmt(score); $("streak").textContent = streak; $("best").textContent = fmt(best); }
function renderClues() {
  const box = $("clues"); box.innerHTML = "";
  for (let p = 0; p <= phase; p++) {
    const d = document.createElement("div"); d.className = "ph p" + (p + 1);
    d.innerHTML = `<h3>${LABELS[p]}<small>${over ? "" : fmt(POINTS[p]) + " pts"}</small></h3><ul>${(cur.indices[p + 1] || []).map(t => `<li></li>`).join("")}</ul>`;
    d.querySelectorAll("li").forEach((li, i) => li.textContent = cur.indices[p + 1][i]);
    if (p < phase) d.style.animation = "none";
    box.appendChild(d);
  }
  $("misses").innerHTML = ""; misses.forEach(m => { const li = document.createElement("li"); li.textContent = m; $("misses").appendChild(li); });
  $("more").hidden = phase >= 2; $("moreCost").textContent = phase < 2 ? "(-" + fmt(POINTS[phase] - POINTS[phase + 1]) + " pts)" : "";
}
function newRound() {
  if (!deck.length) deck = shuffle(all.slice());
  cur = deck.pop(); phase = 0; over = false; misses = [];
  $("result").hidden = true; $("play").hidden = false; $("flash").textContent = "";
  $("answer").value = ""; $("submit").disabled = true; closeSug();
  renderClues(); renderBar(); $("answer").focus({ preventScroll: true });
}
function flash(m) { $("flash").textContent = m; clearTimeout(flash.t); flash.t = setTimeout(() => $("flash").textContent = "", 2200); }
function shake() { const e = $("answer"); e.classList.remove("shake"); void e.offsetWidth; e.classList.add("shake"); }
function advance() {
  if (phase >= 2) return end(false);
  phase++; renderClues();
}
function find(v) {
  const k = nk(v); if (!k) return null;
  return all.find(c => nk(c.nom) === k) || all.find(c => nk(c.id) === k) || null;
}
function submit() {
  if (over) return;
  let c = sugI >= 0 ? sugList[sugI] : find($("answer").value);
  if (!c && sugList.length === 1) c = sugList[0];
  if (!c) { shake(); return flash("Champion inconnu : choisis dans la liste."); }
  closeSug();
  if (c === cur) return end(true);
  if (misses.includes(c.nom)) { shake(); return flash("Déjà essayé."); }
  misses.push(c.nom); shake(); $("answer").value = ""; $("submit").disabled = true;
  flash("Raté !"); advance();
}
function end(win) {
  over = true;
  const pts = win ? POINTS[phase] : 0;
  if (win) { score += pts; streak++; if (score > best) { best = score; try { localStorage.setItem("sdq_best_devine", best); } catch (e) {} } }
  else streak = 0;
  $("play").hidden = true; $("result").hidden = false;
  const im = icon(cur);
  $("reveal").innerHTML = (im ? `<img alt="" src="${im}" onerror="this.remove()">` : "") + `<div class="big"></div><div class="tt"></div>`;
  $("reveal").querySelector(".big").textContent = cur.nom; $("reveal").querySelector(".tt").textContent = cur.titre || "";
  $("msg").className = "msg " + (win ? "ok" : "ko");
  $("msg").innerHTML = win ? `Bravo ! +${fmt(pts)} points<small>Trouvé en phase ${phase + 1}</small>` : `Perdu… c'était ${""}<small>Ta série retombe à 0</small>`;
  if (!win) $("msg").firstChild.textContent = "Perdu… ";
  const f = (cur.faits || []).slice(0, 3); $("faits").innerHTML = ""; f.forEach(t => { const li = document.createElement("li"); li.textContent = t; $("faits").appendChild(li); });
  renderClues(); renderBar(); $("next").focus();
}
/* Suggestions */
function closeSug() { $("sug").hidden = true; sugList = []; sugI = -1; }
function showSug() {
  const k = nk($("answer").value);
  if (!k) return closeSug();
  const a = all.filter(c => nk(c.nom).startsWith(k)), b = all.filter(c => !nk(c.nom).startsWith(k) && nk(c.nom).includes(k));
  sugList = [...a, ...b].slice(0, 7); sugI = -1;
  const box = $("sug"); box.innerHTML = "";
  sugList.forEach((c, i) => {
    const d = document.createElement("div"); const im = icon(c);
    if (im) { const i2 = new Image(); i2.src = im; i2.alt = ""; i2.onerror = () => i2.remove(); d.appendChild(i2); }
    d.appendChild(document.createTextNode(c.nom));
    d.onmousedown = e => { e.preventDefault(); sugI = i; $("answer").value = c.nom; submit(); };
    box.appendChild(d);
  });
  box.hidden = !sugList.length;
}
function markSug() { [...$("sug").children].forEach((d, i) => d.classList.toggle("on", i === sugI)); }
$("answer").oninput = () => { $("submit").disabled = !$("answer").value.trim(); showSug(); };
$("answer").onkeydown = e => {
  if (e.key === "ArrowDown" && sugList.length) { e.preventDefault(); sugI = (sugI + 1) % sugList.length; markSug(); }
  else if (e.key === "ArrowUp" && sugList.length) { e.preventDefault(); sugI = (sugI - 1 + sugList.length) % sugList.length; markSug(); }
  else if (e.key === "Enter") { e.preventDefault(); if (sugI < 0 && sugList.length && !find($("answer").value)) sugI = 0; submit(); }
  else if (e.key === "Escape") closeSug();
};
$("answer").onblur = () => setTimeout(closeSug, 100);
$("submit").onclick = submit;
$("more").onclick = () => { if (!over) { advance(); $("answer").focus({ preventScroll: true }); } };
$("giveUp").onclick = () => { if (!over) end(false); };
$("next").onclick = newRound;
document.addEventListener("keydown", e => { if (e.key === "Enter" && over && document.activeElement !== $("next")) { e.preventDefault(); newRound(); } });
load().then(() => { if (all.length < 5) throw 0; $("status").hidden = true; $("board").hidden = false; newRound(); })
  .catch(() => { $("status").textContent = "Impossible de charger les données du jeu. Recharge la page."; });
renderBar();
</script>
</body>
</html>
