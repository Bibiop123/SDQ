<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plus ou moins – Le Bonfire</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070b16; --panel:#0e1526; --line:#243149; --tx:#e9eef7; --mu:#8d9ab2; --cyan:#3fc1e0; --gold:#e6c36a; --gold-d:#a67c2a; --ok:#4ade80; --ko:#ff6b6b; --frame:#56709c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; color: var(--tx); background: var(--bg); position: relative; overflow-x: hidden; font: 16px/1.5 Barlow, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body::before { content: ""; position: fixed; inset: -20px; z-index: -2; background: url("shopkeeper.jpg") center / cover no-repeat; filter: blur(16px) brightness(.3) saturate(1.2); }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(ellipse at 50% 0%, rgba(63,193,224,.12), transparent 55%), linear-gradient(rgba(7,11,22,.55), var(--bg) 95%); }
  .top { position: sticky; top: 0; z-index: 40; background: rgba(7,11,22,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 980px; margin: 0 auto; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--tx); text-decoration: none; font-family: Cinzel, Georgia, serif; font-weight: 800; letter-spacing: .08em; font-size: 1.05rem; }
  .brand .mark { width: 30px; height: 30px; }
  nav { display: flex; gap: 6px; }
  nav a { padding: 7px 14px; border-radius: 10px; color: #dbe3f1; text-decoration: none; font-weight: 600; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; border: 1.5px solid var(--frame); background: rgba(24,35,62,.92); }
  nav a:hover { border-color: var(--cyan); }
  nav a.on { color: var(--cyan); border-color: rgba(63,193,224,.4); background: rgba(63,193,224,.08); }
  main { max-width: 860px; margin: 0 auto; padding: 30px 16px 20px; }
  .hero { text-align: center; margin-bottom: 22px; }
  h1 { display: inline-flex; align-items: center; gap: 18px; margin: 0; font-family: Cinzel, Georgia, serif; font-weight: 800; font-size: clamp(1.7rem, 6vw, 3rem); letter-spacing: .05em;
       background: linear-gradient(#fff3c4, var(--gold) 45%, var(--gold-d)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 8px rgba(0,0,0,.8)); }
  h1::before, h1::after { content: ""; width: clamp(20px, 7vw, 80px); height: 2px; background: linear-gradient(90deg, transparent, var(--gold)); }
  h1::after { transform: scaleX(-1); }
  .sub { margin: 8px 0 0; color: #c9d3e4; font-size: 1.1rem; font-weight: 500; }
  .game { max-width: 820px; margin: 0 auto; padding: 20px 22px 24px; border: 1px solid var(--line); border-radius: 18px; background: rgba(14,21,38,.86); box-shadow: 0 16px 44px rgba(0,0,0,.6); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .plates { display: flex; gap: 14px; }
  .plate { display: inline-flex; align-items: baseline; gap: 8px; padding: 5px 13px; border: 1.5px solid var(--frame); border-radius: 12px; background: rgba(24,35,62,.92); color: #aab6cd; font-size: .76rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
  .plate b { font-size: 1.2rem; font-weight: 700; letter-spacing: 0; color: var(--gold); text-transform: none; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { padding: 7px 16px; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; background: rgba(24,35,62,.92); color: #dbe3f1; border: 1.5px solid var(--frame); }
  .tabs button.on { color: var(--cyan); border-color: var(--cyan); background: rgba(63,193,224,.1); }
  button { padding: 13px 22px; border: 0; border-radius: 10px; font: inherit; font-size: 1.05rem; font-weight: 700; cursor: pointer; background: var(--cyan); color: #04202a; transition: transform .15s, filter .15s; }
  button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); }
  .q { text-align: center; font-size: 1.35rem; font-weight: 700; margin: 6px 0 20px; min-height: 2em; }
  .q b { color: var(--gold); }
  .duel { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .vs { font-family: Cinzel, Georgia, serif; font-weight: 800; color: var(--gold); font-size: 1.1rem; }
  .opt { flex: 1; max-width: 300px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 10px 16px; border-radius: 16px; border: 2px solid var(--frame); background: rgba(24,35,62,.92); color: var(--tx); cursor: pointer; box-shadow: 0 8px 22px rgba(0,0,0,.45); transition: transform .15s, border-color .15s, box-shadow .15s; }
  .opt:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--cyan); box-shadow: 0 0 22px rgba(63,193,224,.3); filter: none; }
  .opt:disabled { cursor: default; opacity: 1; }
  .opt .pic { width: min(150px, 34vw); aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--gold); background: #0b0f14; box-shadow: 0 0 0 2px #000; overflow: hidden; display: grid; place-items: center; }
  .opt .pic img { width: 100%; height: 100%; display: block; }
  .opt .nm { font-size: 1.05rem; font-weight: 700; text-align: center; line-height: 1.15; min-height: 2.3em; display: grid; place-items: center; }
  .opt .val { min-width: 96px; padding: 4px 12px; border-radius: 99px; border: 1.5px dashed #46557a; color: var(--mu); font-weight: 700; font-size: 1.1rem; text-align: center; }
  .opt.show .val { border-style: solid; border-color: var(--gold); color: var(--gold); background: rgba(230,195,106,.1); }
  .opt.right { border-color: var(--ok); box-shadow: 0 0 24px rgba(74,222,128,.35); }
  .opt.right .val { border-color: var(--ok); color: var(--ok); background: rgba(74,222,128,.1); }
  .opt.wrong { border-color: var(--ko); box-shadow: 0 0 24px rgba(255,107,107,.3); animation: shake .3s; }
  .opt.wrong .val { border-color: var(--ko); color: var(--ko); background: rgba(255,107,107,.1); }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .result { text-align: center; margin-top: 20px; min-height: 90px; }
  .msg { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
  .msg.ko { color: var(--ko); } .msg.ok { color: var(--ok); }
  .msg small { display: block; color: var(--mu); font-size: .92rem; font-weight: 500; }
  .result button { margin-top: 12px; }
  .status { text-align: center; color: var(--mu); padding: 30px 0; }
  footer { max-width: 980px; margin: 14px auto 0; padding: 22px 18px 34px; color: #66738c; font-size: .8rem; text-align: center; border-top: 1px solid rgba(36,49,73,.7); }
  [hidden] { display: none !important; }
  @media (max-width: 560px) { nav a { padding: 7px 9px; font-size: .78rem; letter-spacing: .05em; } .brand { font-size: .9rem; } .game { padding: 16px 10px 18px; } .duel { gap: 6px; } .opt { padding: 12px 6px; } .opt .nm { font-size: .92rem; } .q { font-size: 1.15rem; } }
  @media (max-width: 400px) { .brand { display: none; } .top-in { justify-content: center; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="index.html"><img class="mark" src="logo.svg" alt="" width="30" height="30">LE BONFIRE</a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="shopkeeper.html">Shop</a>
      <a class="on" href="plusmoins.html">Duel</a>
    </nav>
  </div>
</header>
<main>
  <section class="hero">
    <h1>Plus ou moins</h1>
    <p class="sub">Deux choix, une seule bonne réponse. Jusqu'où iras-tu ?</p>
  </section>
  <section class="game">
    <div class="bar">
      <div class="plates">
        <span class="plate">Série <b id="streak">0</b></span>
        <span class="plate">Record <b id="best">0</b></span>
      </div>
      <div class="tabs" id="tabs">
        <button type="button" data-m="items" class="on">Objets</button>
        <button type="button" data-m="champs">Champions</button>
      </div>
    </div>
    <div class="status" id="status">Chargement…</div>
    <div id="board" hidden>
      <div class="q" id="q"></div>
      <div class="duel">
        <button class="opt" id="o0" type="button"></button>
        <span class="vs">OU</span>
        <button class="opt" id="o1" type="button"></button>
      </div>
      <div class="result" id="result" hidden>
        <div class="msg" id="msg"></div>
        <button id="again">Rejouer</button>
      </div>
    </div>
  </section>
</main>
<footer>Projet de fan, non affilié à Riot Games. League of Legends et ses personnages appartiennent à Riot Games, Inc.</footer>
<script>
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("fr-FR").replace(/ | /g, " ");
const pick = a => a[Math.floor(Math.random() * a.length)];
const nk = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
const DD = "https://ddragon.leagueoflegends.com/";

const BASIC = ["Amplifying Tome","B. F. Sword","Blasting Wand","Cloak of Agility","Cloth Armor","Dagger","Faerie Charm","Glowing Mote","Long Sword","Needlessly Large Rod","Null-Magic Mantle","Pickaxe","Rejuvenation Bead","Ruby Crystal","Sapphire Crystal"];
const EPIC = ["Aether Wisp","Bami's Cinder","Bandleglass Mirror","Blighting Jewel","Bramble Vest","Catalyst of Aeons","Caulfield's Warhammer","Chain Vest","Crystalline Bracer","Executioner's Calling","Fated Ashes","Fiendish Codex","Forbidden Idol","Giant's Belt","Glacial Buckler","Haunting Guise","Hearthbound Axe","Hexdrinker","Hextech Alternator","Kindlegem","Last Whisper","Lost Chapter","Negatron Cloak","Noonquiver","Oblivion Orb","Phage","Quicksilver Sash","Rectrix","Recurve Bow","Runic Compass","Scout's Slingshot","Seeker's Armguard","Serrated Dirk","Sheen","Spectre's Cowl","Steel Sigil","The Brutalizer","Tiamat","Tunneler","Vampiric Scepter","Verdant Barrier","Warden's Mail","Winged Moonplate","Zeal"];
const LEGENDARY = ["Abyssal Mask","Actualizer","Archangel's Staff","Ardent Censer","Atma's Reckoning","Axiom Arc","Bandlepipes","Banshee's Veil","Bastionbreaker","Black Cleaver","Blackfire Torch","Blade of the Ruined King","Bloodletter's Curse","Bloodsong","Bloodthirster","Bounty of Worlds","Celestial Opposition","Chempunk Chainsword","Cosmic Drive","Cryptbloom","Dawncore","Dead Man's Plate","Death's Dance","Diadem of Songs","Dream Maker","Dusk and Dawn","Echoes of Helia","Eclipse","Edge of Night","Endless Hunger","Essence Reaver","Experimental Hexplate","Fiendhunter Bolts","Fimbulwinter","Force of Nature","Frozen Heart","Guardian Angel","Guinsoo's Rageblade","Heartsteel","Hexoptics C44","Hextech Gunblade","Hextech Rocketbelt","Hollow Radiance","Horizon Focus","Hubris","Hullbreaker","Iceborn Gauntlet","Immortal Shieldbow","Imperial Mandate","Infinity Edge","Jak'Sho, The Protean","Kaenic Rookern","Knight's Vow","Kraken Slayer","Liandry's Torment","Lich Bane","Locket of the Iron Solari","Lord Dominik's Regards","Luden's Echo","Malignance","Manamune","Maw of Malmortius","Mejai's Soulstealer","Mercurial Scimitar","Mikael's Blessing","Moonstone Renewer","Morellonomicon","Mortal Reminder","Muramana","Nashor's Tooth","Navori Flickerblade","Overlord's Bloodmail","Phantom Dancer","Profane Hydra","Protoplasm Harness","Rabadon's Deathcap","Randuin's Omen","Rapid Firecannon","Ravenous Hydra","Redemption","Riftmaker","Rite of Ruin","Rod of Ages","Runaan's Hurricane","Rylai's Crystal Scepter","Seraph's Embrace","Serpent's Fang","Serylda's Grudge","Shadowflame","Shurelya's Battlesong","Solstice Sleigh","Spear of Shojin","Spectral Cutlass","Spirit Visage","Staff of Flowing Water","Statikk Shiv","Sterak's Gage","Stormrazor","Stormsurge","Stridebreaker","Sundered Sky","Sunfire Aegis","Sword of Blossoming Dawn","Terminus","The Collector","Thornmail","Titanic Hydra","Trinity Force","Umbral Glaive","Unending Despair","Void Staff","Voltaic Cyclosword","Warmog's Armor","Whispering Circlet","Winter's Approach","Wit's End","Youmuu's Ghostblade","Yun Tal Wildarrows","Zaz'Zak's Realmspike","Zeke's Convergence","Zhonya's Hourglass"];

/* Statistiques de champion (niveau 1) : clé Data Dragon, libellé de la question, unité, nombre de décimales */
const STATS = [
  ["hp", "de points de vie", "PV", 0],
  ["attackdamage", "de dégâts d'attaque", "AD", 0],
  ["armor", "d'armure", "armure", 0],
  ["spellblock", "de résistance magique", "RM", 0],
  ["movespeed", "de vitesse de déplacement", "VD", 0],
  ["attackrange", "de portée d'attaque", "portée", 0]
];

let ver = "", mode = "items", data = { items: [], champs: [] }, cur = null, streak = 0, locked = false;
const bestKey = m => "sdq_best_pm_" + m;
const getBest = () => { try { return Number(localStorage.getItem(bestKey(mode))) || 0; } catch (e) { return 0; } };
let best = 0;

async function loadAll() {
  ver = (await (await fetch(DD + "api/versions.json")).json())[0];
  const base = `${DD}cdn/${ver}/data/`;
  const [enI, frI, frC] = await Promise.all([fetch(base + "en_US/item.json"), fetch(base + "fr_FR/item.json"), fetch(base + "fr_FR/champion.json")]).then(r => Promise.all(r.map(x => x.json())));
  const byName = {};
  Object.entries(enI.data).forEach(([id, it]) => {
    if (it.maps && it.maps["11"] && it.gold && it.gold.purchasable && it.inStore !== false) byName[nk(it.name)] = { id };
  });
  const seen = new Set();
  [...BASIC, ...EPIC, ...LEGENDARY].forEach(n => {
    const e = byName[nk(n)]; if (!e || seen.has(e.id) || !frI.data[e.id] || !(frI.data[e.id].maps && frI.data[e.id].maps["11"])) return; seen.add(e.id);
    const it = frI.data[e.id]; if (it.gold && it.gold.total > 0) data.items.push({ name: it.name, img: `${DD}cdn/${ver}/img/item/${e.id}.png`, v: it.gold.total });
  });
  data.champs = Object.values(frC.data).map(c => ({ name: c.name, img: `${DD}cdn/${ver}/img/champion/${c.image.full}`, s: c.stats }));
}

/* Écart toléré entre les deux valeurs : plus la série est longue, plus le duel est serré */
const maxRel = () => Math.max(.06, .9 - streak * .08);
function makePair() {
  let a, b, st = null, key, last = null;
  for (let t = 0; t < 60; t++) {
    if (mode === "items") { a = pick(data.items); b = pick(data.items); key = x => x.v; }
    else { if (!st || t % 10 === 0) st = pick(STATS); a = pick(data.champs); b = pick(data.champs); key = x => x.s[st[0]]; }
    if (a === b || key(a) === key(b)) continue;
    last = [a, b, st, key];
    if (Math.abs(key(a) - key(b)) / Math.max(key(a), key(b)) <= maxRel()) break;
  }
  return last;
}
const unit = v => mode === "items" ? fmt(v) + " or" : fmt(Math.round(v * 100) / 100) + " " + cur.st[2];

function newRound() {
  const [a, b, st, key] = makePair();
  const more = Math.random() < .7;     /* « le plus » ou « le moins » */
  cur = { opts: [a, b], st, key, more, good: (key(a) > key(b)) === more ? 0 : 1 };
  locked = false;
  $("result").hidden = true;
  if (mode === "items") $("q").innerHTML = `Quel objet ${more ? "coûte <b>le plus</b> cher" : "coûte <b>le moins</b> cher"} ?`;
  else $("q").innerHTML = `Quel champion a ${more ? "<b>le plus</b>" : "<b>le moins</b>"} ${st[1]} ?`;
  [0, 1].forEach(i => {
    const o = $("o" + i), x = cur.opts[i];
    o.className = "opt"; o.disabled = false;
    o.innerHTML = `<span class="pic"><img alt="" draggable="false"></span><span class="nm"></span><span class="val">?</span>`;
    const im = o.querySelector("img"); im.src = x.img; im.onerror = () => { im.remove(); };
    o.querySelector(".nm").textContent = x.name;
  });
  renderBar();
}
function choose(i) {
  if (locked) return; locked = true;
  const ok = i === cur.good;
  [0, 1].forEach(j => {
    const o = $("o" + j); o.disabled = true; o.classList.add("show");
    o.querySelector(".val").textContent = unit(cur.key(cur.opts[j]));
    if (j === cur.good) o.classList.add("right"); else if (j === i) o.classList.add("wrong");
  });
  if (ok) {
    streak++; if (streak > best) { best = streak; try { localStorage.setItem(bestKey(mode), best); } catch (e) {} }
    renderBar(); clearTimeout(newRound.t); newRound.t = setTimeout(() => { if (locked && cur && streak) newRound(); }, 1300);
  } else {
    const rec = streak > 0 && streak >= best;
    $("msg").className = "msg ko";
    $("msg").innerHTML = `Raté ! Série de ${streak}.<small>${rec && streak ? "Nouveau record !" : "Record : " + best}</small>`;
    $("result").hidden = false; $("again").focus();
  }
}
function renderBar() { $("streak").textContent = streak; $("best").textContent = best; }
function start() { streak = 0; best = getBest(); clearTimeout(newRound.t); newRound(); }

$("o0").onclick = () => choose(0);
$("o1").onclick = () => choose(1);
$("again").onclick = start;
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  mode = b.dataset.m; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b)); start();
});
document.addEventListener("keydown", e => {
  if (!cur || $("board").hidden) return;
  if (e.key === "ArrowLeft" || e.key === "1") choose(0);
  else if (e.key === "ArrowRight" || e.key === "2") choose(1);
  else if ((e.key === "Enter" || e.key === " ") && !$("result").hidden) { e.preventDefault(); start(); }
});
loadAll().then(() => { $("status").hidden = true; $("board").hidden = false; start(); })
  .catch(() => { $("status").textContent = "Impossible de charger les données du jeu (Data Dragon). Vérifie ta connexion et recharge la page."; });
renderBar();
</script>
</body>
</html>
