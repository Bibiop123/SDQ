  const base = `https://ddragon.leagueoflegends.com/cdn/${ver}/data/`;

  const byName = {};
  Object.entries(en.data).forEach(([id, it]) => {
    /* Seulement les objets vendus dans la boutique de la Faille de l'invocateur (5v5) : ni ARAM, ni Arena, etc. */
    const sr = it.maps && it.maps["11"] && it.gold && it.gold.purchasable && it.inStore !== false;
    if (sr) byName[nk(it.name)] = { id, sr };
  });
  const seen = new Set();
  [...BASIC, ...EPIC, ...LEGENDARY].forEach(n => {
    const e = byName[nk(n)]; if (!e || seen.has(e.id) || !fr.data[e.id] || !(fr.data[e.id].maps && fr.data[e.id].maps["11"])) return; seen.add(e.id);
    const it = fr.data[e.id]; if (it.gold && it.gold.total > 0) pool.push({ id: e.id, name: it.name, price: it.gold.total });
  });
}

/* ============================================================
   AFFICHAGE
   ============================================================ */
function renderEq() {
  const eq = $("eq"); eq.innerHTML = "";
  cur.items.forEach((it, i) => {
    if (i) { const op = document.createElement("span"); op.className = "op"; op.textContent = "+"; eq.appendChild(op); }
    const d = document.createElement("div"); d.className = "sitem" + (shown.includes(i) ? " shown" : "") + (i === lastShown ? " fresh" : "");
    const pic = document.createElement("div"); pic.className = "pic";
    const im = new Image(); im.alt = it.name; im.src = icon(it.id); im.draggable = false; im.onerror = () => { im.remove(); pic.textContent = it.name; };
    pic.appendChild(im);
    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = it.name;
    const g = document.createElement("div"); g.className = "gold"; g.textContent = shown.includes(i) ? fmt(it.price) + " or" : "? or";
    d.append(pic, nm, g); eq.appendChild(d);
  });
  const eqs = document.createElement("span"); eqs.className = "op"; eqs.textContent = "=";
  const t = document.createElement("div"); t.className = "total" + (over ? (cur.won ? " ok" : " ko") : "");
  t.innerHTML = over ? fmt(cur.total) + "<small>or</small>" : "?<small>or</small>";
  eq.append(eqs, t);
}
function renderDots() {
  $("dots").innerHTML = Array.from({ length: MAX_TRIES }, (_, i) =>
    `<i class="${i < tries ? "used" : i === tries ? (over ? (cur.won ? "win" : "") : "now") : ""}"></i>`).join("");
}
function renderBar() { $("streak").textContent = streak; $("best").textContent = best; $("recordPlate").classList.toggle("broken", recordBroken); }
function flash(msg) { $("flash").textContent = msg; clearTimeout(flash.t); flash.t = setTimeout(() => { $("flash").textContent = ""; }, 2200); }
function shake(id) { const e = $(id); e.classList.remove("shake"); void e.offsetWidth; e.classList.add("shake"); }

/* ============================================================
   PARTIE
   ============================================================ */
let deck = [];
function newRound() {
  if (deck.length < 3) deck = shuffle(pool.slice());
  const items = [deck.pop(), deck.pop(), deck.pop()];
  cur = { items, total: items.reduce((s, i) => s + i.price, 0), won: false };
  tries = 0; over = false; shown = []; guesses = []; lastShown = -1;
  $("result").hidden = true; $("play").hidden = false; $("misses").innerHTML = ""; $("flash").textContent = ""; $("calc").textContent = "";
  $("answer").value = ""; $("answer").disabled = false; $("submit").disabled = true;
  $("bubble").innerHTML = `Voilà ta commande ! Ça fait <b>combien d'or</b> en tout ?${MARGIN ? ` <small style="display:block;color:var(--mu);font-size:.8rem;margin-top:2px">À ${MARGIN} or près, ça ira.</small>` : ""}`;
  renderEq(); renderDots(); renderBar();
  $("answer").focus({ preventScroll: true });
}
/* Lit un nombre ou un petit calcul (+ − × ÷, parenthèses) sans utiliser eval. « 1000+500+500 » -> 2000 */
function parse(v) {
  const t = String(v).toLowerCase().replace(/[\s\u00a0\u202f]/g, "").replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-").replace(/,/g, ".");
  if (!t || !/^[0-9+\-*/().]+$/.test(t)) return NaN;
  let i = 0;
  const num = () => { const m = /^\d+(\.\d+)?/.exec(t.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); };
  const atom = () => { if (t[i] === "(") { i++; const r = sum(); if (t[i++] !== ")") throw 0; return r; } if (t[i] === "-") { i++; return -atom(); } return num(); };
  const prod = () => { let r = atom(); while (t[i] === "*" || t[i] === "/") { const o = t[i++]; const b = atom(); r = o === "*" ? r * b : r / b; } return r; };
  const sum = () => { let r = prod(); while (t[i] === "+" || t[i] === "-") { const o = t[i++]; const b = prod(); r = o === "+" ? r + b : r - b; } return r; };
  try { const r = sum(); return i === t.length && isFinite(r) ? Math.round(r * 100) / 100 : NaN; } catch (e) { return NaN; }
}
/* Le marchand râle quand on se trompe */
function grr() {
  const g = $("grr"), w = $("faceWrap");
  [g, w].forEach(e => e.classList.remove("on", "angry")); void g.getBoundingClientRect();
  g.classList.add("on"); w.classList.add("angry");
  clearTimeout(grr.t); grr.t = setTimeout(() => { g.classList.remove("on"); w.classList.remove("angry"); }, 1800);
}
function loseTry() { tries++; if (tries >= MAX_TRIES) return endRound(false); renderDots(); }
function submit() {
  if (over) return;
  const g = parse($("answer").value);
  if (isNaN(g)) { shake("answer"); return flash("Entre un nombre."); }
  if (Math.abs(g - cur.total) <= MARGIN) { guesses.push(g); return endRound(true, g); }
  const up = g < cur.total;
  const li = document.createElement("li"); li.innerHTML = `${fmt(g)} or<small>${up ? "plus ↑" : "moins ↓"}</small>`; $("misses").prepend(li);
  grr(); shake("answer"); flash(up ? "C'est plus cher !" : "C'est moins cher !");
  guesses.push(g);
  /* chaque erreur dévoile le prix d'un objet */
  const hidden = [0, 1, 2].filter(i => !shown.includes(i));
  lastShown = -1;
  if (hidden.length > 1) { lastShown = hidden[Math.floor(Math.random() * hidden.length)]; shown.push(lastShown); }
  $("answer").value = ""; $("calc").textContent = ""; $("submit").disabled = true;
  loseTry(); if (!over) renderEq();
}
function endRound(win, g) {
  over = true; cur.won = win; shown = [0, 1, 2]; lastShown = -1;
  $("play").hidden = true; $("result").hidden = false;
  if (win) { streak++; if (streak > best) { if (best > 0) recordBroken = true; best = streak; try { localStorage.setItem("sdq_best_shop", best); } catch (e) {} } }
  else { streak = 0; recordBroken = false; }
  const n = tries + (win ? 1 : 0);
  $("msg").className = "msg " + (win ? "ok" : "ko");
  const gap = g !== undefined ? Math.abs(g - cur.total) : null;
  $("msg").innerHTML = win ? `Bravo, c'est ${fmt(cur.total)} or !<small>${gap === 0 ? "" : "À " + fmt(gap) + " or près · "}trouvé en ${n} essai${n > 1 ? "s" : ""}</small>` : `Perdu… c'était ${fmt(cur.total)} or.`;
  $("recap").textContent = cur.items.map(i => i.name + " " + fmt(i.price)).join(" + ") + " = " + fmt(cur.total);
  renderEq(); renderDots(); renderBar();
  $("next").focus();
}

$("answer").oninput = () => {
  let v = $("answer").value.replace(/[^0-9+\-*/().,×÷−\s\u00a0\u202f]/g, "");   /* pas de lettres */
  if (v !== $("answer").value) $("answer").value = v;
  if (/^[0-9\s\u00a0\u202f]*$/.test(v)) { const d = v.replace(/\D/g, ""); v = d ? fmt(Number(d)) : ""; $("answer").value = v; }   /* un simple nombre : on le met en forme */
  const isCalc = /[+\-*/×÷−()]/.test(v), r = isCalc ? parse(v) : NaN;
  $("calc").textContent = isCalc ? (isNaN(r) ? "" : "= " + fmt(r) + " or") : "";
  $("submit").disabled = over || !v.trim();
};
$("answer").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); submit(); } };
$("submit").onclick = submit;
$("next").onclick = newRound;
$("giveUp").onclick = () => { if (!over) endRound(false); };
document.addEventListener("keydown", e => {
  if (!cur) return;
  if (e.key === "Escape") { e.preventDefault(); if (!over) endRound(false); else newRound(); }
  else if (e.key === "Enter" && over && document.activeElement !== $("next")) { e.preventDefault(); newRound(); }
});
$("resetBest").onclick = () => {
  if (!confirm("Remettre le record à 0 ?")) return;
  best = 0; recordBroken = false; try { localStorage.removeItem("sdq_best_shop"); } catch (e) {}
  renderBar();
};

loadItems().then(() => {
  if (pool.length < 3) throw new Error("vide");
  $("status").hidden = true; $("board").hidden = false;
  newRound();
}).catch(() => { $("status").textContent = "Impossible de charger les objets du jeu (Data Dragon). Vérifie ta connexion et recharge la page."; });
renderBar();
</script>
</body>
</html>
