<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Le Bonfire" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#e6c36a"/><stop offset="1" stop-color="#a67c2a"/></linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6a13"/><stop offset=".55" stop-color="#ffa63d"/><stop offset="1" stop-color="#ffe9a8"/></linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#fff8dc"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d9ab2"/><stop offset=".5" stop-color="#e9eef7"/><stop offset="1" stop-color="#6b7a96"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".78" r=".62"><stop offset="0" stop-color="#ff8a2a" stop-opacity=".6"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
    <clipPath id="disc"><circle cx="32" cy="32" r="27.5"/></clipPath>
  </defs>
  <style>
    .flame { transform-origin: 32px 53px; animation: flick 1.6s ease-in-out infinite; }
    .core  { transform-origin: 32px 53px; animation: flick 1.1s ease-in-out infinite reverse; }
    .spark { animation: rise 2.4s ease-in infinite; }
    .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; }
    @keyframes flick { 0%,100% { transform: scale(1,1); } 50% { transform: scale(.95,1.07); } }
    @keyframes rise { 0% { transform: translateY(4px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-9px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flame, .core, .spark { animation: none; } }
  </style>

  <!-- médaillon -->
  <circle cx="32" cy="32" r="29.5" fill="#0b1020" stroke="url(#gold)" stroke-width="2.6"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#3fc1e0" stroke-opacity=".45" stroke-width=".8"/>
  <circle cx="32" cy="32" r="27.5" fill="url(#glow)"/>

  <g clip-path="url(#disc)">
    <!-- épée plantée -->
    <g transform="rotate(11 32 50)">
      <path d="M30.6 21 H33.4 V43 L32 49 L30.6 43 Z" fill="url(#steel)"/>
      <rect x="31.7" y="22" width=".6" height="21" fill="#ffffff" opacity=".35"/>
      <rect x="24.5" y="17.6" width="15" height="3.4" rx="1.4" fill="url(#gold)"/>
      <rect x="30.9" y="10.5" width="2.2" height="7.4" rx=".8" fill="#6b4a2a"/>
      <circle cx="32" cy="8.6" r="2.7" fill="url(#gold)"/>
    </g>

    <!-- braises -->
    <ellipse cx="32" cy="53.5" rx="17.5" ry="4" fill="#161d2b" stroke="#a67c2a" stroke-width=".9"/>
    <ellipse cx="22" cy="53" rx="2.4" ry="1.3" fill="#2a3446"/>
    <ellipse cx="41.5" cy="53.2" rx="2.8" ry="1.4" fill="#2a3446"/>
    <ellipse cx="31" cy="55" rx="3" ry="1.2" fill="#232d3f"/>

    <!-- flammes -->
    <path class="flame" d="M32 53.5 C21 53.5 16 44.5 21 36.5 C23 40.5 26 41.5 27.3 38.5 C26 32.5 29 28 31.2 23.5 C31.4 29 34.4 31 36.3 29 C37.4 33.5 41.4 35.5 40.6 40.5 C43.4 38.6 44.4 36.4 44.2 34 C48.6 41.5 43.4 53.5 32 53.5 Z" fill="url(#fire)"/>
    <path class="core" d="M32 53.5 C26 53.5 23.8 47.5 28 42.4 C29.2 44.4 31 45.2 32.3 43.2 C33.2 40.4 34.2 38.4 35.4 36.4 C38.6 41.4 40.4 45 37.6 49.6 C36.6 52.2 34.4 53.5 32 53.5 Z" fill="url(#core)"/>

    <!-- étincelles -->
    <circle class="spark" cx="21.5" cy="33" r="1.1" fill="#ffd27a"/>
    <circle class="spark s2" cx="43.5" cy="30" r="1" fill="#ffd27a"/>
    <circle class="spark s3" cx="37" cy="27" r=".9" fill="#fff3c4"/>
  </g>
</svg>
