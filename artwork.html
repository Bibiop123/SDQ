<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salle de Quiz – Devine le champion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --gold:#e6c36a; --gold-d:#a67c2a; --teal:#1fb5c4; --ink:#0d1117; --panel:#141b24; --tx:#eee; --mu:#9aa6b4; --ok:#4ade80; --ko:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; color:var(--tx); background:var(--ink); position:relative; overflow-x:hidden;
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  /* Fond : artwork flouté et assombri, comme l'accueil */
  body::before { content:""; position:fixed; inset:-20px; z-index:-2;
    background:url("images/briar.jpg") center / cover no-repeat; filter:blur(14px) brightness(.35) saturate(1.1); }
  body::after { content:""; position:fixed; inset:0; z-index:-1;
    background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.65) 100%); }
  main { max-width:760px; margin:0 auto; padding:20px 16px 40px; }

  .home { display:inline-block; margin-bottom:6px; color:var(--mu); text-decoration:none; font-size:.9rem; }
  .home:hover { color:var(--gold); }
  h1 { margin:0; text-align:center; font-family:Cinzel,Georgia,"Times New Roman",serif; font-weight:800;
       font-size:clamp(1.8rem,6vw,2.6rem); letter-spacing:.04em;
       background:linear-gradient(#fff3c4,var(--gold) 45%,var(--gold-d)); -webkit-background-clip:text; background-clip:text; color:transparent;
       filter:drop-shadow(0 2px 6px rgba(0,0,0,.7)); }
  .sub { text-align:center; color:#cfd6df; margin:2px 0 18px; }

  .tabs { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:18px; }
  .tab { padding:6px 14px; border-radius:99px; border:1px solid #2c3948; background:rgba(20,27,36,.8); font-size:.85rem; color:var(--mu); }
  .tab.on { background:linear-gradient(#f3d98a,var(--gold-d)); color:#1a1305; border-color:var(--gold); font-weight:700; }

  .stats { display:flex; flex-wrap:wrap; justify-content:space-between; color:var(--mu); font-size:.9rem; margin-bottom:8px; padding:0 4px; }
  #score-label { color:var(--gold); }
  /* Record battu : texte de score agrandi + bulle de BD */
  #score-label.record { flex:1 1 100%; order:-1; display:flex; flex-direction:column; align-items:center; gap:2px; margin-bottom:10px; }
  .burst-wrap { filter:drop-shadow(3px 3px 0 #000) drop-shadow(0 0 14px rgba(255,200,40,.55)); }
  .burst { display:grid; place-items:center; min-width:min(86vw,360px); padding:46px 38px; text-align:center;
           background:radial-gradient(circle at 50% 40%, #fff27a, #ffc21a 70%, #ff8f1a);
           clip-path:polygon(50.0% 0.0%,54.7% 14.3%,62.9% 1.7%,65.3% 13.0%,75.0% 6.7%,71.9% 21.4%,85.4% 14.6%,81.7% 25.6%,93.3% 25.0%,83.3% 36.2%,98.3% 37.1%,89.7% 44.8%,100.0% 50.0%,85.7% 54.7%,98.3% 62.9%,87.0% 65.3%,93.3% 75.0%,78.6% 71.9%,85.4% 85.4%,74.4% 81.7%,75.0% 93.3%,63.8% 83.3%,62.9% 98.3%,55.2% 89.7%,50.0% 100.0%,45.3% 85.7%,37.1% 98.3%,34.7% 87.0%,25.0% 93.3%,28.1% 78.6%,14.6% 85.4%,18.3% 74.4%,6.7% 75.0%,16.7% 63.8%,1.7% 62.9%,10.3% 55.2%,0.0% 50.0%,14.3% 45.3%,1.7% 37.1%,13.0% 34.7%,6.7% 25.0%,21.4% 28.1%,14.6% 14.6%,25.6% 18.3%,25.0% 6.7%,36.2% 16.7%,37.1% 1.7%,44.8% 10.3%);
           font-family:Fredoka,"Arial Rounded MT Bold","Hiragino Maru Gothic ProN",system-ui,sans-serif; font-weight:700; font-size:clamp(1.5rem,7vw,2.3rem); letter-spacing:.02em; line-height:1.05;
           color:#d62828; text-shadow:2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,.35); }
  .rec-score { font-family:Fredoka,"Arial Rounded MT Bold",system-ui,sans-serif; font-weight:700; font-size:clamp(1.5rem,6vw,2.1rem); letter-spacing:.03em; color:var(--gold); text-shadow:2px 2px 0 #000; }
  .pop { animation:pop .65s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { 0% { transform:scale(.2) rotate(-12deg); opacity:0; } 60% { transform:scale(1.18) rotate(3deg); opacity:1; } 100% { transform:scale(1) rotate(-2deg); } }

  .stage { display:flex; gap:12px; align-items:flex-start; }
  .stage .frame { flex:1; min-width:0; }
  .frame { aspect-ratio:16/9; overflow:hidden; border-radius:14px; border:3px solid var(--gold); background:#000;
           box-shadow:0 0 0 2px #000, 0 0 0 5px rgba(31,181,196,.55), 0 18px 50px rgba(0,0,0,.7); transition:box-shadow .4s ease; }
  .frame img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .7s ease; }
  .frame { position:relative; }
  /* Filigrane de compte à rebours au centre de l'artwork */
  .countdown { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; pointer-events:none; }
  .cd-badge { position:relative; width:84px; height:84px; border-radius:50%; display:grid; place-items:center;
              background:rgba(8,12,18,.45); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); opacity:.85; }
  .cd-badge svg { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .cd-badge circle { fill:none; stroke-width:4; }
  .cd-badge .bg { stroke:rgba(255,255,255,.2); }
  .cd-badge .fg { stroke:var(--gold); stroke-linecap:round; stroke-dasharray:213.6; stroke-dashoffset:0; animation:cdring var(--cd,5s) linear forwards; }
  @keyframes cdring { to { stroke-dashoffset:213.6; } }
  .cd-num { font-family:Cinzel,Georgia,serif; font-weight:800; font-size:2rem; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.8); }
  #cd-next { pointer-events:auto; padding:7px 16px; font-size:.9rem; opacity:.9; }
  .frame.noanim img { transition:none !important; }   /* début de manche : zoom immédiat, sans animation */
  .frame.revealed img { transform:scale(1) !important; }   /* artwork entier (victoire, défaite, abandon) */
  .frame.revealed { box-shadow:0 0 0 2px #000, 0 0 0 5px var(--teal), 0 0 40px rgba(31,181,196,.45), 0 18px 50px rgba(0,0,0,.7); }

  .side { width:92px; flex-shrink:0; display:flex; flex-direction:column; gap:4px; }
  .t { padding:2px 8px; border-radius:6px; background:rgba(255,107,107,.15); border:1px solid var(--ko); color:#ffc2c2;
       font-size:.72rem; line-height:1.4; overflow-wrap:anywhere; }

  .msg { min-height:30px; margin-top:14px; font-weight:700; text-align:center; font-family:Cinzel,Georgia,serif; font-size:1.1rem; }
  .msg.ok { color:var(--ok); } .msg.ko { color:var(--ko); }

  .row { display:flex; gap:10px; margin:12px 0; }
  input { flex:1; min-width:0; padding:13px 14px; border-radius:10px; border:2px solid #24707a; background:rgba(13,17,23,.85); color:var(--tx); font-size:1rem; }
  input:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(31,181,196,.25); }
  input::placeholder { color:#6f7b89; }
  button { padding:13px 18px; border:0; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; transition:transform .15s ease, filter .15s ease;
           background:linear-gradient(#f3d98a,var(--gold-d)); color:#1a1305; }
  button:hover:not(:disabled) { transform:translateY(-1px); filter:brightness(1.08); }
  button.alt { background:rgba(20,27,36,.85); color:var(--gold); border:2px solid var(--gold-d); font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  #giveup, #next { flex:1; }

  /* Liste de suggestions : une petite carte encadrée par champion */
  .combo { position:relative; flex:1; min-width:0; }
  .combo input { width:100%; }
  .suggest { position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:30; margin:0; padding:6px; list-style:none;
             display:grid; grid-template-columns:1fr 1fr; gap:6px;   /* 2 colonnes : 2 fois plus de champions visibles */
             max-height:300px; overflow-y:auto; background:rgba(13,17,23,.97); border:2px solid var(--gold-d); border-radius:12px;
             box-shadow:0 14px 40px rgba(0,0,0,.75); scrollbar-width:thin; scrollbar-color:var(--gold-d) #1a222c; }
  .suggest li { display:flex; align-items:center; gap:10px; min-width:0; margin:0; padding:5px 10px 5px 5px; cursor:pointer;
                border:1px solid #2c3948; border-radius:10px; background:linear-gradient(#1b232d,#141b24);
                transition:border-color .12s ease, background .12s ease; }
  .suggest li:hover, .suggest li.sel { border-color:var(--teal); background:linear-gradient(#22313e,#18222c); }
  .ico { width:38px; height:38px; flex-shrink:0; border-radius:8px; border:2px solid var(--gold-d); overflow:hidden; background:#0b0f14;
         display:grid; place-items:center; font-family:Cinzel,Georgia,serif; font-weight:800; color:var(--gold); }
  .ico img { width:100%; height:100%; object-fit:cover; object-position:50% 12%; display:block; }
  .suggest .nm { min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Écran de démarrage */
  .start { margin:10px auto 0; max-width:560px; text-align:center; padding:28px 22px 30px; border-radius:14px;
           border:3px solid var(--gold); background:linear-gradient(#1b232d,#11161d);
           box-shadow:0 0 0 2px #000, 0 0 0 5px rgba(31,181,196,.55), 0 18px 50px rgba(0,0,0,.7); }
  .start h2 { margin:0 0 8px; font-family:Cinzel,Georgia,serif; color:var(--gold); font-size:1.5rem; }
  .start p { margin:0 0 20px; color:#cfd6df; }
  #start { font-family:Cinzel,Georgia,serif; font-size:1.3rem; letter-spacing:.08em; padding:14px 46px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <a class="home" href="index.html">← Accueil</a>
  <h1>Salle de Quiz</h1>
  <p class="sub">Devine le champion à partir d'un morceau d'artwork</p>

  <div class="tabs">
    <span class="tab on">Artwork</span>
    <span class="tab">Silhouette (bientôt)</span>
    <span class="tab">Musique (bientôt)</span>
  </div>

  <section class="start" id="start-screen">
    <h2>Prêt à jouer ?</h2>
    <p>Un morceau d'artwork va apparaître. Tu as <span id="max-tries"></span> essais : à chaque erreur, l'image se dévoile un peu plus.</p>
    <button id="start">Start</button>
  </section>

  <div id="game" hidden>
  <div class="stats"><span id="tries-label"></span><span id="score-label"></span></div>
  <div class="stage">
    <div class="side" id="tries-list"></div>
    <div class="frame" id="frame">
      <img id="art" alt="Artwork à deviner">
      <div class="countdown" id="countdown" hidden>
        <div class="cd-badge">
          <svg viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="34"/><circle class="fg" cx="40" cy="40" r="34"/></svg>
          <span class="cd-num" id="cd-num">5</span>
        </div>
        <button id="cd-next">Suivant →</button>
      </div>
    </div>
  </div>
  <div class="msg" id="msg"></div>

  <div class="row">
    <div class="combo">
      <input id="answer" placeholder="Nom du champion…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggest">
      <ul class="suggest" id="suggest" role="listbox" hidden></ul>
    </div>
    <button id="submit">Valider</button>
  </div>
  <div class="row">
    <button class="alt" id="giveup">Abandonner</button>
    <button class="alt" id="next" style="display:none">Suivant →</button>
  </div>
  </div>
</main>

<script>
/* ===== CONFIGURATION : ajoute tes questions ici =====
   name : bonne réponse
   img  : chemin de l'image
   face : zone du visage à éviter, en % de l'image
          (x, y = centre ; rx, ry = demi-largeur / demi-hauteur)
   Le point de zoom est tiré au hasard à chaque manche, loin de cette zone. */
const ROUNDS = [
  { name: "Lillia", img: "images/lillia.jpg", face: { x: 0.51, y: 0.22, rx: 0.09, ry: 0.13 } },
  { name: "Briar",  img: "images/briar.jpg",  face: { x: 0.64, y: 0.29, rx: 0.10, ry: 0.17 } }
];

/* Liste des suggestions du champ de saisie */
const NAMES = ["Aatrox","Ahri","Akali","Alistar","Amumu","Annie","Ashe","Briar","Caitlyn","Darius","Diana","Draven","Ekko","Evelynn","Ezreal","Fiora","Garen","Gwen","Illaoi","Irelia","Jax","Jhin","Jinx","Kai'Sa","Katarina","Kayn","Lee Sin","Leona","Lillia","Lucian","Lulu","Lux","Master Yi","Miss Fortune","Morgana","Nami","Nasus","Nautilus","Nidalee","Orianna","Pyke","Rell","Renata Glasc","Samira","Senna","Seraphine","Sett","Shen","Singed","Sona","Soraka","Teemo","Thresh","Tristana","Vayne","Vel'Koz","Vi","Viego","Xayah","Yasuo","Yone","Zed","Zeri","Ziggs","Zoe","Zyra"];

/* Niveaux de zoom : un par essai (le dernier = image entière) */
const ZOOM = [7, 4.5, 3, 2, 1.4, 1];
const MAX_TRIES = ZOOM.length;

/* ===== LOGIQUE DU JEU ===== */
const $ = id => document.getElementById(id);
const normalize = s => s.normalize("NFD").replace(/[\u0300-\u036f'’\s-]/g, "").toLowerCase();

let order = [], index = 0, tries = 0, finished = false, score = 0, best = 0;
let recordRun = false, recordPhrase = "", popPending = false;   /* record en cours de battement */
const PHRASES = ["NEW HIGH SCORE !", "NOUVEAU RECORD !", "BOOM !", "WOW !", "POW !", "YEAH !", "INCROYABLE !", "BANG !"];
let wrong = [];  /* noms déjà essayés pendant la manche */

/* ===== Liste de suggestions personnalisée ===== */
let shown = [], sel = -1;

/* Identifiant Data Dragon (Riot) : Kai'Sa -> Kaisa, Master Yi -> MasterYi, etc. */
const DD_FIX = { "Renata Glasc": "Renata" };
const ddId = n => DD_FIX[n] || n.replace(/'(.)/g, (_, c) => c.toLowerCase()).replace(/[^A-Za-z0-9]/g, "");
const iconUrl = n => `https://ddragon.leagueoflegends.com/cdn/img/champion/loading/${ddId(n)}_0.jpg`;

function hideSuggestions() {
  $("suggest").hidden = true; $("answer").setAttribute("aria-expanded", "false"); sel = -1;
}

function renderSuggestions() {
  const q = normalize($("answer").value);
  const banned = wrong.map(normalize);
  const ok = NAMES.filter(n => !banned.includes(normalize(n)));
  shown = q ? ok.filter(n => normalize(n).startsWith(q)).concat(ok.filter(n => !normalize(n).startsWith(q) && normalize(n).includes(q))) : [];
  const ul = $("suggest");
  ul.innerHTML = ""; sel = -1;
  if (!shown.length || $("answer").disabled) return hideSuggestions();
  shown.forEach(name => {
    const li = document.createElement("li");
    li.setAttribute("role", "option");
    const ico = document.createElement("div"); ico.className = "ico";
    const img = new Image(); img.alt = ""; img.loading = "lazy"; img.src = iconUrl(name);
    img.onerror = () => { ico.textContent = name[0]; };      /* pas d'image : initiale dans le cadre */
    ico.appendChild(img);
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = name;
    li.append(ico, nm);
    li.onmousedown = e => e.preventDefault();               /* garde le focus sur le champ */
    li.onclick = () => pick(name);
    ul.appendChild(li);
  });
  ul.hidden = false; $("answer").setAttribute("aria-expanded", "true");
}

function pick(name) { $("answer").value = name; hideSuggestions(); guess(); }

function moveSel(d) {
  const items = $("suggest").children; if (!items.length) return;
  if (sel >= 0) items[sel].classList.remove("sel");
  sel = sel < 0 ? (d > 0 ? 0 : items.length - 1) : Math.min(Math.max(sel + d, 0), items.length - 1);
  items[sel].classList.add("sel"); items[sel].scrollIntoView({ block: "nearest" });
}

function refreshSuggestions() { hideSuggestions(); }
try { best = Number(localStorage.getItem("sdq_best")) || 0; } catch (e) {}

/* Zone visible à un niveau de zoom z quand on zoome autour du point (ox, oy) */
function windowAt(ox, oy, z) {
  return { x0: ox - ox / z, x1: ox + (1 - ox) / z, y0: oy - oy / z, y1: oy + (1 - oy) / z };
}

/* Tire un point de zoom au hasard en évitant le visage le plus longtemps possible :
   on garde les points pour lesquels le visage reste hors cadre sur le plus de niveaux de zoom. */
function pickFocus(face) {
  let best = -1, pool = [];
  for (let i = 0; i < 400; i++) {
    const ox = 0.05 + Math.random() * 0.9, oy = 0.05 + Math.random() * 0.9;
    let score = 0;
    for (let k = 0; k < ZOOM.length - 1; k++) {
      const w = windowAt(ox, oy, ZOOM[k]);
      const hit = w.x0 < face.x + face.rx && w.x1 > face.x - face.rx &&
                  w.y0 < face.y + face.ry && w.y1 > face.y - face.ry;
      if (hit) break;
      score++;
    }
    if (score > best) { best = score; pool = []; }
    if (score === best) pool.push([ox, oy]);
  }
  const [x, y] = pool[Math.floor(Math.random() * pool.length)];
  return `${(x * 100).toFixed(1)}% ${(y * 100).toFixed(1)}%`;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function current() { return order[index]; }

function render() {
  const zoom = finished ? 1 : ZOOM[Math.min(tries, MAX_TRIES - 1)];
  $("art").style.transform = `scale(${zoom})`;
  $("tries-label").textContent = finished ? "" : `Essai ${tries + 1}/${MAX_TRIES}`;
  const sl = $("score-label");
  if (recordRun) {
    sl.className = "record";
    sl.innerHTML = `<div class="burst-wrap${popPending ? " pop" : ""}"><div class="burst">${recordPhrase}</div></div>` +
                   `<span class="rec-score">Score ${score}</span>`;
    popPending = false;   /* l'animation ne se rejoue pas à chaque rafraîchissement */
  } else {
    sl.className = "";
    sl.textContent = `Score ${score} · Record ${best}`;
  }
}

function loadRound() {
  clearCountdown();
  tries = 0; finished = false; wrong = [];
  /* L'image reste cachée et sans animation tant qu'elle n'est pas chargée ET déjà zoomée */
  $("frame").classList.add("noanim");
  $("frame").classList.remove("revealed");
  $("art").style.visibility = "hidden";
  refreshSuggestions();
  const show = () => {
    $("art").style.visibility = "visible";
    void $("art").offsetWidth;                       /* applique le zoom avant de rétablir les animations */
    $("frame").classList.remove("noanim");
  };
  $("art").onload = () => {   /* le cadre prend le format de l'image : elle s'affiche entière à la fin */
    $("frame").style.aspectRatio = $("art").naturalWidth + " / " + $("art").naturalHeight;
    show();
  };
  $("art").onerror = show;
  $("art").style.transformOrigin = pickFocus(current().face);
  render();                                          /* zoom initial appliqué tout de suite */
  $("art").src = current().img;
  $("tries-list").innerHTML = "";
  $("msg").textContent = ""; $("msg").className = "msg";
  $("next").style.display = "none";
  $("answer").value = "";
  $("answer").disabled = $("submit").disabled = $("giveup").disabled = false;
  $("answer").focus();
  render();
}

function endRound(won) {
  finished = true;
  $("frame").classList.add("revealed");   /* dévoile l'artwork entier dans tous les cas */
  $("answer").disabled = $("submit").disabled = $("giveup").disabled = true;
  $("next").style.display = won ? "none" : "";   /* après une victoire, le bouton est dans le compte à rebours */
  $("msg").className = "msg " + (won ? "ok" : "ko");
  $("msg").textContent = won ? `Bravo, c'était ${current().name} !` : `Perdu… c'était ${current().name}.`;
  if (won) {
    score++;
    if (score > best) {
      best = score; try { localStorage.setItem("sdq_best", best); } catch (e) {}
      let next;
      if (!recordRun) next = PHRASES[0];                      /* premier dépassement : NEW HIGH SCORE ! */
      else do { next = PHRASES[Math.floor(Math.random() * PHRASES.length)]; } while (next === recordPhrase);
      recordRun = true; recordPhrase = next; popPending = true;
    }
  } else {
    score = 0; recordRun = false;
  }
  render();
  if (won) startCountdown();
}

/* ===== Compte à rebours après une bonne réponse ===== */
const COUNTDOWN = 5;   /* secondes avant le personnage suivant */
let cdTimer = null;

function clearCountdown() {
  clearInterval(cdTimer); cdTimer = null;
  $("countdown").hidden = true;
}

function startCountdown() {
  clearCountdown();
  let left = COUNTDOWN;
  $("cd-num").textContent = left;
  $("countdown").style.setProperty("--cd", COUNTDOWN + "s");
  $("countdown").hidden = false;      /* ré-affiché => l'anneau repart de zéro */
  cdTimer = setInterval(() => {
    left--;
    $("cd-num").textContent = Math.max(left, 0);
    if (left <= 0) goNext();
  }, 1000);
}

function goNext() {
  clearCountdown();
  index++;
  if (index >= order.length) { order = shuffle(ROUNDS.slice()); index = 0; }
  loadRound();
}

function guess() {
  if (finished) return;
  const value = $("answer").value.trim();
  if (!value) return;
  if (normalize(value) === normalize(current().name)) return endRound(true);
  if (wrong.map(normalize).includes(normalize(value))) {   /* déjà essayé : on ne compte pas */
    $("answer").value = "";
    return;
  }

  tries++;
  wrong.push(value);
  refreshSuggestions();
  const chip = document.createElement("span");
  chip.className = "t"; chip.textContent = value;
  $("tries-list").appendChild(chip);
  $("answer").value = "";

  if (tries >= MAX_TRIES) endRound(false);
  else { $("msg").className = "msg ko"; $("msg").textContent = "Raté, l'image se dévoile…"; render(); }
}

$("submit").onclick = guess;
$("answer").oninput = renderSuggestions;
$("answer").onfocus = renderSuggestions;
$("answer").onblur = () => setTimeout(hideSuggestions, 150);
$("answer").onkeydown = e => {
  if (e.key === "ArrowDown") { e.preventDefault(); if (!$("suggest").hidden) moveSel(2); else renderSuggestions(); }   /* une ligne plus bas */
  else if (e.key === "ArrowUp") { e.preventDefault(); moveSel(-2); }
  else if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && sel >= 0) { e.preventDefault(); moveSel(e.key === "ArrowRight" ? 1 : -1); }
  else if (e.key === "Escape") hideSuggestions();
  else if (e.key === "Enter") { e.preventDefault(); if (sel >= 0 && shown[sel]) pick(shown[sel]); else { hideSuggestions(); guess(); } }
};
$("giveup").onclick = () => endRound(false);
$("next").onclick = goNext;
$("cd-next").onclick = goNext;

$("max-tries").textContent = MAX_TRIES;
$("start").onclick = () => {
  order = shuffle(ROUNDS.slice());
  index = 0; score = 0; recordRun = false;
  $("start-screen").hidden = true;
  $("game").hidden = false;
  loadRound();
};
</script>
</body>
</html>
