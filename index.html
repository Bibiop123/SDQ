<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salle de Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --gold:#e6c36a; --gold-d:#a67c2a; --teal:#1fb5c4; --ink:#0d1117; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: #eee; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--ink); position: relative; overflow-x: hidden;
  }
  /* Fond : artwork flouté et assombri */
  body::before {
    content: ""; position: fixed; inset: -20px; z-index: -2;
    background: url("images/briar.jpg") center / cover no-repeat;
    filter: blur(14px) brightness(.35) saturate(1.1);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.65) 100%);
  }
  main {
    min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 28px 16px;
  }
  h1 {
    margin: 0; font-family: Cinzel, Georgia, "Times New Roman", serif; font-weight: 800;
    font-size: clamp(2rem, 7vw, 3.4rem); letter-spacing: .04em; text-align: center;
    background: linear-gradient(#fff3c4, var(--gold) 45%, var(--gold-d));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.7));
  }
  .tagline { margin: -10px 0 0; color: #cfd6df; text-align: center; }

  /* Cadre central cliquable */
  .card {
    display: block; width: min(560px, 100%); text-decoration: none; color: inherit;
    border: 3px solid var(--gold); border-radius: 14px; overflow: hidden;
    background: #11161d;
    box-shadow: 0 0 0 2px #000, 0 0 0 5px rgba(31,181,196,.55), 0 18px 50px rgba(0,0,0,.7);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px) scale(1.015); outline: none;
    box-shadow: 0 0 0 2px #000, 0 0 0 5px var(--teal), 0 0 40px rgba(31,181,196,.45), 0 22px 60px rgba(0,0,0,.75);
  }
  .card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; transition: transform .6s ease; }
  .card:hover img { transform: scale(1.05); }
  .card .img-wrap { overflow: hidden; }
  .card .label { padding: 14px 18px 16px; border-top: 2px solid var(--gold-d); background: linear-gradient(#1b232d, #11161d); }
  .card .label strong { display: block; font-family: Cinzel, Georgia, serif; font-size: 1.35rem; color: var(--gold); }
  .card .label span { color: #aeb8c4; font-size: .92rem; }
  .soon { color: #8b95a3; font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Salle de Quiz</h1>
  <p class="tagline">Devine des champions de League of Legends</p>

  <a class="card" href="artwork.html">
    <div class="img-wrap"><img src="images/lillia.jpg" alt="Artwork de League of Legends"></div>
    <div class="label">
      <strong>Artwork</strong>
      <span>Devine le champion à partir d'un morceau d'artwork</span>
    </div>
  </a>

  <p class="soon">D'autres jeux arrivent bientôt…</p>
</main>
</body>
</html>
