<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salle de Quiz – Devine le champion</title>
<style>
  :root { --bg:#f4f1ea; --card:#fff; --tx:#1d1b18; --mu:#7a746a; --ac:#6d4aff; --ok:#1f9d55; --ko:#d23f3f; --bd:#e2ddd2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15141a; --card:#201f28; --tx:#f0eee8; --mu:#9a96a6; --bd:#33313e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.5rem; margin:0; }
  .sub { color:var(--mu); margin:2px 0 16px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .tab { padding:6px 12px; border-radius:99px; border:1px solid var(--bd); background:var(--card); font-size:.85rem; color:var(--mu); }
  .tab.on { background:var(--ac); color:#fff; border-color:var(--ac); }
  .stats { display:flex; justify-content:space-between; color:var(--mu); font-size:.9rem; margin-bottom:6px; }
  .frame { aspect-ratio:16/9; overflow:hidden; border-radius:14px; border:1px solid var(--bd); background:#000; }
  .frame img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .7s ease; }
  .stage { display:flex; gap:10px; align-items:flex-start; }
  .stage .frame { flex:1; min-width:0; }
  .side { width:92px; flex-shrink:0; display:flex; flex-direction:column; gap:4px; }
  .t { padding:2px 8px; border-radius:6px; background:var(--ko); color:#fff; font-size:.72rem; line-height:1.4; overflow-wrap:anywhere; }
  .msg { min-height:28px; font-weight:600; }
  .msg.ok { color:var(--ok); } .msg.ko { color:var(--ko); }
  .row { display:flex; gap:8px; margin:14px 0; }
  input { flex:1; min-width:0; padding:12px; border-radius:10px; border:1px solid var(--bd); background:var(--card); color:var(--tx); font-size:1rem; }
  button { padding:12px 16px; border:0; border-radius:10px; background:var(--ac); color:#fff; font-size:1rem; cursor:pointer; }
  button.alt { background:var(--card); color:var(--tx); border:1px solid var(--bd); }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<main>
  <h1>Salle de Quiz</h1>
  <p class="sub">Mini-jeux d'images, de sons et de visuels</p>

  <div class="tabs">
    <span class="tab on">Artwork</span>
    <span class="tab">Silhouette (bientôt)</span>
    <span class="tab">Musique (bientôt)</span>
  </div>

  <div class="stats"><span id="tries-label"></span><span id="score-label"></span></div>
  <div class="stage">
    <div class="side" id="tries-list"></div>
    <div class="frame" id="frame"><img id="art" alt="Artwork à deviner"></div>
  </div>
  <div class="msg" id="msg"></div>

  <div class="row">
    <input id="answer" list="names" placeholder="Nom du champion…" autocomplete="off">
    <button id="submit">Valider</button>
  </div>
  <div class="row">
    <button class="alt" id="giveup">Abandonner</button>
    <button class="alt" id="next" style="display:none">Suivant →</button>
  </div>
  <datalist id="names"></datalist>
</main>

<script>
/* ===== CONFIGURATION : ajoute tes questions ici =====
   name : bonne réponse
   img  : chemin de l'image
   face : zone du visage à éviter, en % de l'image
          (x, y = centre ; rx, ry = demi-largeur / demi-hauteur)
   Le point de zoom est tiré au hasard à chaque manche, loin de cette zone. */
const ROUNDS = [
  { name: "Lillia", img: "images/lillia.jpg", face: { x: 0.51, y: 0.22, rx: 0.09, ry: 0.13 } },
  { name: "Briar",  img: "images/briar.jpg",  face: { x: 0.64, y: 0.29, rx: 0.10, ry: 0.17 } }
];

/* Liste des suggestions du champ de saisie */
const NAMES = ["Aatrox","Ahri","Akali","Alistar","Amumu","Annie","Ashe","Briar","Caitlyn","Darius","Diana","Draven","Ekko","Evelynn","Ezreal","Fiora","Garen","Gwen","Illaoi","Irelia","Jax","Jhin","Jinx","Kai'Sa","Katarina","Kayn","Lee Sin","Leona","Lillia","Lucian","Lulu","Lux","Master Yi","Miss Fortune","Morgana","Nami","Nasus","Nautilus","Nidalee","Orianna","Pyke","Rell","Renata Glasc","Samira","Senna","Seraphine","Sett","Shen","Singed","Sona","Soraka","Teemo","Thresh","Tristana","Vayne","Vel'Koz","Vi","Viego","Xayah","Yasuo","Yone","Zed","Zeri","Ziggs","Zoe","Zyra"];

/* Niveaux de zoom : un par essai (le dernier = image entière) */
const ZOOM = [7, 4.5, 3, 2, 1.4, 1];
const MAX_TRIES = ZOOM.length;

/* ===== LOGIQUE DU JEU ===== */
const $ = id => document.getElementById(id);
const normalize = s => s.normalize("NFD").replace(/[\u0300-\u036f'’\s-]/g, "").toLowerCase();

let order = [], index = 0, tries = 0, finished = false, score = 0, best = 0;
let wrong = [];  /* noms déjà essayés pendant la manche */

function refreshSuggestions() {
  const banned = wrong.map(normalize);
  $("names").innerHTML = NAMES
    .filter(n => !banned.includes(normalize(n)))
    .map(n => `<option value="${n}">`).join("");
}
try { best = Number(localStorage.getItem("sdq_best")) || 0; } catch (e) {}

/* Zone visible à un niveau de zoom z quand on zoome autour du point (ox, oy) */
function windowAt(ox, oy, z) {
  return { x0: ox - ox / z, x1: ox + (1 - ox) / z, y0: oy - oy / z, y1: oy + (1 - oy) / z };
}

/* Tire un point de zoom au hasard en évitant le visage le plus longtemps possible :
   on garde les points pour lesquels le visage reste hors cadre sur le plus de niveaux de zoom. */
function pickFocus(face) {
  let best = -1, pool = [];
  for (let i = 0; i < 400; i++) {
    const ox = 0.05 + Math.random() * 0.9, oy = 0.05 + Math.random() * 0.9;
    let score = 0;
    for (let k = 0; k < ZOOM.length - 1; k++) {
      const w = windowAt(ox, oy, ZOOM[k]);
      const hit = w.x0 < face.x + face.rx && w.x1 > face.x - face.rx &&
                  w.y0 < face.y + face.ry && w.y1 > face.y - face.ry;
      if (hit) break;
      score++;
    }
    if (score > best) { best = score; pool = []; }
    if (score === best) pool.push([ox, oy]);
  }
  const [x, y] = pool[Math.floor(Math.random() * pool.length)];
  return `${(x * 100).toFixed(1)}% ${(y * 100).toFixed(1)}%`;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function current() { return order[index]; }

function render() {
  $("art").style.transform = `scale(${ZOOM[Math.min(tries, MAX_TRIES - 1)]})`;
  $("tries-label").textContent = finished ? "" : `Essai ${tries + 1}/${MAX_TRIES}`;
  $("score-label").textContent = `Score ${score} · Record ${best}`;
}

function loadRound() {
  tries = 0; finished = false; wrong = [];
  refreshSuggestions();
  $("art").onload = () => {   /* le cadre prend le format de l'image : elle s'affiche entière à la fin */
    $("frame").style.aspectRatio = $("art").naturalWidth + " / " + $("art").naturalHeight;
  };
  $("art").style.transformOrigin = pickFocus(current().face);
  $("art").src = current().img;
  $("tries-list").innerHTML = "";
  $("msg").textContent = ""; $("msg").className = "msg";
  $("next").style.display = "none";
  $("answer").value = "";
  $("answer").disabled = $("submit").disabled = $("giveup").disabled = false;
  $("answer").focus();
  render();
}

function endRound(won) {
  finished = true;
  $("art").style.transform = "scale(1)";
  $("answer").disabled = $("submit").disabled = $("giveup").disabled = true;
  $("next").style.display = "";
  $("msg").className = "msg " + (won ? "ok" : "ko");
  $("msg").textContent = won ? `Bravo, c'était ${current().name} !` : `Perdu… c'était ${current().name}.`;
  if (won) {
    score++;
    if (score > best) { best = score; try { localStorage.setItem("sdq_best", best); } catch (e) {} }
  } else {
    score = 0;
  }
  render();
}

function guess() {
  if (finished) return;
  const value = $("answer").value.trim();
  if (!value) return;
  if (normalize(value) === normalize(current().name)) return endRound(true);
  if (wrong.map(normalize).includes(normalize(value))) {   /* déjà essayé : on ne compte pas */
    $("answer").value = "";
    return;
  }

  tries++;
  wrong.push(value);
  refreshSuggestions();
  const chip = document.createElement("span");
  chip.className = "t"; chip.textContent = value;
  $("tries-list").appendChild(chip);
  $("answer").value = "";

  if (tries >= MAX_TRIES) endRound(false);
  else { $("msg").className = "msg ko"; $("msg").textContent = "Raté, l'image se dévoile…"; render(); }
}

$("submit").onclick = guess;
$("answer").onkeydown = e => { if (e.key === "Enter") guess(); };
$("giveup").onclick = () => endRound(false);
$("next").onclick = () => {
  index++;
  if (index >= order.length) { order = shuffle(ROUNDS.slice()); index = 0; }
  loadRound();
};

order = shuffle(ROUNDS.slice());
loadRound();
</script>
</body>
</html>
